name: GitHub Metrics
on:
  # Updates automatically every day at midnight
  schedule: [{cron: "0 0 * * *"}]
  # Allows you to run the action manually from the Actions tab
  workflow_dispatch:
  # Updates when you push changes to the main branch
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: adii3404
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Kolkata
